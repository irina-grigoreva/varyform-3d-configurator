services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: varyform
      POSTGRES_USER: varyform
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - varyform-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U varyform -d varyform"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  varyform-postgres:
